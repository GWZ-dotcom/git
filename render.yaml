services:
  - type: web
    name: soberano-assistencia
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: APP_USERNAME
        value: richer
      - key: APP_INITIAL_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
